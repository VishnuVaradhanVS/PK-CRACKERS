databases:
  - name: crackers-store-db
    databaseName: crackers_store
    user: crackers
    plan: 0.1c-256mb

services:
  - type: web
    name: crackers-store
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: crackers-store.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://crackers-store.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: crackers-store-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
    disk:
      name: crackers-media
      mountPath: /var/data
      sizeGB: 5
