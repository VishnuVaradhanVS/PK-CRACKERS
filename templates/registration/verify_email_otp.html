{% extends 'base.html' %}
{% block title %}Verify email · PK CRACKERS{% endblock %}
{% block content %}
<section class="auth-panel glass">
  <p class="eyebrow">EMAIL VERIFICATION</p><h1>Verify your email</h1>
  <p class="muted">Enter the 6-digit code sent to <strong>{{ email }}</strong>. It expires in 10 minutes.</p>
  <form method="post" class="formbox auth-form">
    {% csrf_token %}
    <label for="otp">Verification code</label>
    <input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" required placeholder="000000">
    <button class="button" type="submit">Verify email and create account</button>
  </form>
  <form method="post" class="formbox">
    {% csrf_token %}<input type="hidden" name="action" value="resend">
    <button class="button secondary" type="submit">Resend verification code</button>
  </form>
  <p class="muted"><a href="{% url 'signup' %}">Start signup again</a></p>
</section>
{% endblock %}
