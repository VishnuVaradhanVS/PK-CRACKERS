{% extends 'base.html' %}{% block content %}<p class="eyebrow">ACCOUNT</p><h1>My orders</h1><div class="tablebox"><table><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th></tr>{% for order in orders %}<tr><td><a href="{% url 'order_detail' order.pk %}">{{ order.pk }}</a></td><td>{{ order.created_at|date:"d M Y H:i" }}</td><td>₹{{ order.total_amount }}</td><td>{{ order.get_status_display }}</td></tr>{% empty %}<tr><td colspan="4">No orders yet.</td></tr>{% endfor %}</table></div>{% endblock %}
